# Build the web app and publish it to GitHub Pages.
#
# The content bundle is generated during the build (`pnpm content`), not
# committed, so the only inputs are the language pack and the app source.
name: Deploy web app

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/core/**"
      - "languages/**"
      # All of scripts/, not just the content build: this workflow also runs
      # the purity guard and validate-pack, which pulls in the two reports and
      # scripts/lib. Naming one file meant a change to the checks themselves
      # did not re-run the checks.
      - "scripts/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a queued run supersedes a waiting one but never
# cancels a deploy that has already started.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Language-agnostic, so run once rather than once per pack.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r test
      # The engine must not learn a language. Cheap to check, and exactly the
      # kind of rule that erodes one convenient import at a time.
      - run: node scripts/check-core-purity.mjs

  # Every pack has to build and hold its shape, not only the one that ships:
  # a pack nobody deploys is still a pack somebody is working on, and the
  # breakage to catch is the one that arrives while it is half-written.
  #
  # The question-coverage gates are not here. They belong to the pack being
  # deployed, below, because a pack whose questions are still being generated
  # fails them by definition and would report that as a broken build.
  packs:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pack: [latin, greek]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build ${{ matrix.pack }}
        env:
          LANG_PACK: ${{ matrix.pack }}
        run: pnpm --filter @lang-tutor/web build
      - name: Fold and families
        run: >
          node --import tsx scripts/validate-pack.mjs
          --pack languages/${{ matrix.pack }} --profile-only
      - name: Syllabus shape
        run: >
          node --import tsx scripts/grammar-report.mjs
          --pack languages/${{ matrix.pack }}

  build:
    needs: packs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # One build per language, each under its own path.
      #
      # The language is compiled in — the profile is aliased as a module, so the
      # theme, the manifest, the icon, the strings and the dictionary cache name
      # are all fixed at build time. There is no in-app switcher and adding one
      # would be a much larger change. What makes two of them safe on one origin
      # is that each pack namespaces its own storage keys; identical keys would
      # be two languages writing over each other's progress.
      #
      # Pages takes one artifact per deployment, so the builds are collected into
      # subdirectories of a single site rather than deployed separately. Both the
      # asset URLs and the service worker's scope have to agree with the path a
      # build is served from, which is what BASE_PATH sets.
      #
      # LANG_PACKS lists what to publish. A pack is validated immediately after
      # it is built, so publishing a pack means it passed its own gates: a pack
      # still generating its questions fails coverage and stops the deploy, and
      # Pages goes on serving the last good one rather than replacing it with a
      # half-written syllabus. Drop it from the list to ship without it.
      - name: Build each language into its own path
        env:
          LANG_PACKS: ${{ vars.LANG_PACKS || 'latin greek' }}
          REPO: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          for pack in $LANG_PACKS; do
            echo "::group::$pack"
            LANG_PACK="$pack" BASE_PATH="/$REPO/$pack/" \
              pnpm --filter @lang-tutor/web build
            # The syllabus and the question set have to hold up, not just
            # compile. The reference databases are not in this repo, so the
            # gates needing them report themselves skipped rather than passing
            # quietly.
            LANG_PACK="$pack" node --import tsx scripts/validate-pack.mjs \
              --pack "languages/$pack" --built apps/web/public/content
            mkdir -p "site/$pack"
            cp -R apps/web/dist/. "site/$pack/"
            echo "::endgroup::"
          done
      # Something has to answer at the root, or the site's own URL 404s. Built
      # from the packs' own profiles so a new language needs no edit here.
      - name: Write the root index
        env:
          LANG_PACKS: ${{ vars.LANG_PACKS || 'latin greek' }}
        run: node scripts/build-site-index.mjs site
      # Pages must already be switched on for the repo, with Settings → Pages →
      # Source set to "GitHub Actions". That is a one-time manual step and
      # cannot be automated from here: `enablement: true` asks this action to
      # create the site, and the workflow's GITHUB_TOKEN is refused ("Resource
      # not accessible by integration") because creating a Pages site needs
      # admin on the repo, which a workflow token cannot grant itself.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
