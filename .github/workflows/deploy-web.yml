# Build the web app and publish it to GitHub Pages.
#
# The content bundle is generated during the build (`pnpm content`), not
# committed, so the only inputs are `content/` and the app source.
name: Deploy web app

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/core/**"
      - "content/**"
      - "scripts/build-web-content.mjs"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a queued run supersedes a waiting one but never
# cancels a deploy that has already started.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r test
      - name: Build
        # Pages serves a project site from /<repo>/, and both the asset URLs and
        # the service worker's scope have to agree with that.
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: pnpm --filter @latin-tutor/web build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
