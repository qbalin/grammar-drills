# Build the web app and publish it to GitHub Pages.
#
# The content bundle is generated during the build (`pnpm content`), not
# committed, so the only inputs are the language pack and the app source.
name: Deploy web app

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/core/**"
      - "languages/**"
      # All of scripts/, not just the content build: this workflow also runs
      # the purity guard and validate-pack, which pulls in the two reports and
      # scripts/lib. Naming one file meant a change to the checks themselves
      # did not re-run the checks.
      - "scripts/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a queued run supersedes a waiting one but never
# cancels a deploy that has already started.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r test
      # The engine must not learn a language. Cheap to check, and exactly the
      # kind of rule that erodes one convenient import at a time.
      - run: node scripts/check-core-purity.mjs
      - name: Build
        # Pages serves a project site from /<repo>/, and both the asset URLs and
        # the service worker's scope have to agree with that.
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          # One build per language. A second pack deploys from its own job with
          # its own LANG_PACK and its own BASE_PATH — the storage keys and the
          # dictionary cache name must differ, or two packs on one origin would
          # share a progress file.
          LANG_PACK: ${{ vars.LANG_PACK || 'latin' }}
        run: pnpm --filter @lang-tutor/web build
      # The syllabus and the question set have to hold up, not just compile.
      # The reference databases are not available in CI, so the gates that need
      # them report themselves skipped rather than passing quietly.
      - name: Validate the language pack
        env:
          LANG_PACK: ${{ vars.LANG_PACK || 'latin' }}
        run: >
          node --import tsx scripts/validate-pack.mjs
          --pack languages/${{ vars.LANG_PACK || 'latin' }}
          --built apps/web/public/content
      # Pages must already be switched on for the repo, with Settings → Pages →
      # Source set to "GitHub Actions". That is a one-time manual step and
      # cannot be automated from here: `enablement: true` asks this action to
      # create the site, and the workflow's GITHUB_TOKEN is refused ("Resource
      # not accessible by integration") because creating a Pages site needs
      # admin on the repo, which a workflow token cannot grant itself.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
